<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="The app context owns four kinds of thing: threads, the clock, windows and theme, platform services; only post, poster and waker may be called from another thread">
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="20" y="34" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#1b1f27">What the app context owns</text>

  <!-- card 1 -->
  <rect x="20" y="56" width="200" height="230" rx="10" fill="#eef3ff" stroke="#7fa3e0"/>
  <text x="38" y="82" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1b1f27">Threads</text>
  <text x="38" y="114" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1b1f27">receive(source, fn)</text>
  <text x="38" y="136" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1b1f27">post(fn)</text>
  <text x="38" y="158" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1b1f27">poster() · waker()</text>
  <text x="38" y="180" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1b1f27">scheduler()</text>
  <text x="38" y="212" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5b6472">work that must run on</text>
  <text x="38" y="228" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5b6472">the logic thread</text>

  <!-- card 2 -->
  <rect x="240" y="56" width="200" height="230" rx="10" fill="#f4f6fa" stroke="#c9d1dd"/>
  <text x="258" y="82" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1b1f27">The clock</text>
  <text x="258" y="114" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1b1f27">clock().add(fn)</text>
  <text x="258" y="136" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1b1f27">clock().remove(id)</text>
  <text x="258" y="168" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5b6472">once per frame, only</text>
  <text x="258" y="184" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5b6472">while something is added:</text>
  <text x="258" y="200" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5b6472">an idle app sleeps</text>

  <!-- card 3 -->
  <rect x="460" y="56" width="200" height="230" rx="10" fill="#f4f6fa" stroke="#c9d1dd"/>
  <text x="478" y="82" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1b1f27">Windows and theme</text>
  <text x="478" y="114" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1b1f27">open_window(model, cfg)</text>
  <text x="478" y="136" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1b1f27">close_window(id)</text>
  <text x="478" y="158" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1b1f27">set_theme(theme)</text>
  <text x="478" y="180" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1b1f27">follow_system_theme()</text>
  <text x="478" y="212" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5b6472">every window takes the</text>
  <text x="478" y="228" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5b6472">same theme</text>

  <!-- card 4 -->
  <rect x="680" y="56" width="200" height="230" rx="10" fill="#f4f6fa" stroke="#c9d1dd"/>
  <text x="698" y="82" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1b1f27">The platform</text>
  <text x="698" y="114" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1b1f27">choose_files(dlg, done)</text>
  <text x="698" y="136" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1b1f27">show_message(kind, …)</text>
  <text x="698" y="158" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1b1f27">on_file_drop(fn)</text>
  <text x="698" y="180" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1b1f27">set_global_key_handler(fn)</text>
  <text x="698" y="212" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5b6472">the system's dialogs,</text>
  <text x="698" y="228" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5b6472">never blocking</text>

  <!-- the one door -->
  <rect x="20" y="308" width="860" height="72" rx="10" fill="#eef7f1" stroke="#5fd38d"/>
  <text x="40" y="336" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1b1f27">Another thread may call three of these:</text>
  <text x="40" y="360" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#2f7d54">post(fn) · poster() · waker()</text>
  <text x="470" y="348" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5b6472">Everything else on this page belongs to the logic thread.</text>
  <text x="470" y="366" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5b6472">A file dialog returns at once; its answer arrives later, on that thread.</text>
</svg>
