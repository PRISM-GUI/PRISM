<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1000" width="920" height="1000" role="img" aria-label="What a board brings up before PRISM's static constructors run">
  <rect width="920" height="1000" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <g font-family="sans-serif" fill="#1a1a1a">
    <text x="40" y="42" font-size="18" font-weight="bold">What a board brings up before PRISM's static constructors run</text>

    <rect x="140" y="70" width="640" height="80" rx="8" fill="#fdf3e8" stroke="#a07a3a"/>
    <text x="170" y="100" font-size="15" font-weight="bold">reset</text>
    <text x="170" y="126" font-size="13">the chip starts from address zero</text>

    <line x1="460" y1="150" x2="460" y2="196" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="474" y="180" font-size="12" fill="#3a3a3a">jumps into the board's init</text>

    <rect x="140" y="200" width="640" height="80" rx="8" fill="#fdf3e8" stroke="#a07a3a"/>
    <text x="170" y="230" font-size="15" font-weight="bold">startup code</text>
    <text x="170" y="256" font-size="13">clocks, pin muxing, the board's early calls</text>

    <line x1="460" y1="280" x2="460" y2="326" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="474" y="310" font-size="12" fill="#3a3a3a">brings up the memory the heap needs</text>

    <rect x="140" y="330" width="640" height="100" rx="8" fill="#eef3fb" stroke="#4a6fa5"/>
    <text x="170" y="360" font-size="15" font-weight="bold">the RAM that holds the heap is up</text>
    <text x="170" y="386" font-size="13">ESP32: ESP-IDF brings up PSRAM before the constructors run</text>
    <text x="170" y="408" font-size="13">STM32F746: SDRAM, MPU and clocks in .preinit_array</text>

    <line x1="460" y1="430" x2="460" y2="476" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="474" y="460" font-size="12" fill="#3a3a3a">now the heap can be used</text>

    <rect x="140" y="480" width="640" height="100" rx="8" fill="#eef3fb" stroke="#4a6fa5"/>
    <text x="170" y="510" font-size="15" font-weight="bold">static constructors</text>
    <text x="170" y="536" font-size="13">may allocate: libstdc++'s emergency exception pool mallocs here</text>
    <text x="170" y="558" font-size="13">PRISM's own allocate nothing (tests/test_no_static_allocation.cpp)</text>

    <line x1="460" y1="580" x2="460" y2="626" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="474" y="610" font-size="12" fill="#3a3a3a">then the framework starts</text>

    <rect x="140" y="630" width="640" height="100" rx="8" fill="#eef7ee" stroke="#4a7a4a"/>
    <text x="170" y="660" font-size="15" font-weight="bold">main() / app_main()</text>
    <text x="170" y="686" font-size="13">register devices and decoders by name, because a static registrar</text>
    <text x="170" y="708" font-size="13">is dropped by a static link: register_speaker(), register_jpeg_decoder(), bluetooth::start()</text>

    <line x1="320" y1="730" x2="320" y2="796" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="334" y="770" font-size="12" fill="#3a3a3a">starts the board's own work</text>
    <line x1="600" y1="730" x2="600" y2="796" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="614" y="770" font-size="12" fill="#3a3a3a">starts the app's threads</text>

    <rect x="110" y="800" width="360" height="80" rx="8" fill="#eef7ee" stroke="#4a7a4a"/>
    <text x="140" y="830" font-size="15" font-weight="bold">board tasks</text>
    <text x="140" y="856" font-size="13">the codec writer, the Bluetooth link</text>

    <rect x="490" y="800" width="360" height="80" rx="8" fill="#eef7ee" stroke="#4a7a4a"/>
    <text x="520" y="830" font-size="15" font-weight="bold">frame_app threads</text>
    <text x="520" y="856" font-size="13">the logic thread, then the render thread</text>

    <text x="40" y="940" font-size="13" fill="#3a3a3a">PRISM's static constructors allocate nothing and touch no hardware.</text>
  </g>
</svg>
