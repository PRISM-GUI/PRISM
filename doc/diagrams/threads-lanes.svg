<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="The model lives on the logic thread; other threads reach it only through Shared, Channel or post, and the window thread only copies draws">
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="20" y="34" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#1b1f27">One thread owns the model</text>

  <!-- lanes -->
  <rect x="20" y="56" width="210" height="270" rx="10" fill="#f4f6fa" stroke="#c9d1dd"/>
  <rect x="345" y="56" width="210" height="270" rx="10" fill="#eef3ff" stroke="#7fa3e0"/>
  <rect x="670" y="56" width="210" height="270" rx="10" fill="#f4f6fa" stroke="#c9d1dd"/>

  <text x="125" y="84" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1b1f27">Worker thread</text>
  <text x="450" y="84" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1b1f27">Logic thread</text>
  <text x="775" y="84" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1b1f27">Window thread</text>

  <rect x="34" y="120" width="182" height="70" rx="8" fill="#ffffff" stroke="#9aa1b2"/>
  <text x="125" y="150" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1b1f27">read_sensor()</text>
  <text x="125" y="172" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#5b6472">your slow function</text>

  <rect x="352" y="120" width="196" height="130" rx="8" fill="#ffffff" stroke="#7fa3e0"/>
  <text x="450" y="148" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1b1f27">Field · State · Derived</text>
  <text x="450" y="170" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1b1f27">List · every widget</text>
  <text x="450" y="196" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#5b6472">view(), attach(), reactions</text>
  <text x="450" y="222" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#5b6472">run only here</text>

  <rect x="684" y="120" width="182" height="70" rx="8" fill="#ffffff" stroke="#9aa1b2"/>
  <text x="775" y="150" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1b1f27">events · draw</text>
  <text x="775" y="172" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#5b6472">never runs your code</text>

  <!-- worker -> logic -->
  <line x1="232" y1="150" x2="340" y2="150" stroke="#4ea1ff" stroke-width="2"/>
  <polygon points="340,150 331,145 331,155" fill="#4ea1ff"/>
  <text x="286" y="141" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#2c6cb0">Shared · newest</text>

  <line x1="232" y1="186" x2="340" y2="186" stroke="#4ea1ff" stroke-width="2"/>
  <polygon points="340,186 331,181 331,191" fill="#4ea1ff"/>
  <text x="286" y="205" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#2c6cb0">Channel · all</text>

  <line x1="232" y1="232" x2="340" y2="232" stroke="#4ea1ff" stroke-width="2"/>
  <polygon points="340,232 331,227 331,237" fill="#4ea1ff"/>
  <text x="286" y="251" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#2c6cb0">ctx.post(fn)</text>

  <!-- logic -> window: draws -->
  <line x1="557" y1="150" x2="665" y2="150" stroke="#5fd38d" stroke-width="2"/>
  <polygon points="665,150 656,145 656,155" fill="#5fd38d"/>
  <text x="611" y="141" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#2f7d54">draw list</text>

  <!-- window -> logic: input -->
  <line x1="665" y1="222" x2="557" y2="222" stroke="#f2a33a" stroke-width="2"/>
  <polygon points="557,222 566,217 566,227" fill="#f2a33a"/>
  <text x="611" y="243" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9a6412">input events</text>

  <text x="20" y="356" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#5b6472">Setting a field from another thread is a data race: PRISM stops the program and names the rule, in every build.</text>
  <text x="20" y="378" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#5b6472">core::Latest is the fourth way: newest value, never locking, so an audio callback can publish.</text>
</svg>
