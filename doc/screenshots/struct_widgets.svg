<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1082.2 266" width="1082.2" height="266" role="img" aria-label="A model of Fields holding widget types: a heading label, a slider, a checkbox and a button, each pointing at the widget it becomes.">
<style>
  .hl { opacity: 0; animation: walk 6.4s infinite; }
  @keyframes walk { 0% { opacity: 0 } 3% { opacity: 1 } 22.00% { opacity: 1 } 25.00% { opacity: 0 } 100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .hl { animation: none; opacity: 0.55; } }
</style>
<rect width="1082.2" height="266" fill="#ffffff"/>
<text x="24" y="42" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1f2328">Or pick the widget yourself: a Field holds it</text>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1242f"/></marker>
<rect x="24" y="64" width="644.2" height="144" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="38" y="82" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" xml:space="preserve">struct Player {</text>
<text x="38" y="102" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" xml:space="preserve">    core::Field&lt;ui::Label&lt;&gt;&gt; title{{.value = &quot;Now playing&quot;, .heading = true}};</text>
<text x="38" y="122" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" xml:space="preserve">    core::Field&lt;ui::Slider&lt;&gt;&gt; volume{{.value = 0.6, .label = &quot;volume&quot;}};</text>
<text x="38" y="142" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" xml:space="preserve">    core::Field&lt;ui::Checkbox&gt; shuffle{{.checked = true, .label = &quot;shuffle&quot;}};</text>
<text x="38" y="162" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" xml:space="preserve">    core::Field&lt;ui::Button&gt; play{{.text = &quot;Play&quot;}};</text>
<text x="38" y="182" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" xml:space="preserve">};</text>
