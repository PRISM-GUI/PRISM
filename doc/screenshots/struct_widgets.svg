<text x="38" y="122" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" xml:space="preserve">    core::Field&lt;ui::Slider&lt;&gt;&gt; volume{{.value = 0.6, .label = &quot;volume&quot;}};</text>
<text x="38" y="142" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" xml:space="preserve">    core::Field&lt;ui::Checkbox&gt; shuffle{{.checked = true, .label = &quot;shuffle&quot;}};</text>
<text x="38" y="162" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" xml:space="preserve">    core::Field&lt;ui::Button&gt; play{{.text = &quot;Play&quot;}};</text>
<text x="38" y="182" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" xml:space="preserve">};</text>
