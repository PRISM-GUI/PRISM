<text x="38" y="82" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" xml:space="preserve">enum class Theme { Light, Dark, System };</text>
<text x="38" y="102" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#1f2328" xml:space="preserve"></text>
