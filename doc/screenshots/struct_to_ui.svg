<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 858 488" width="858" height="488" role="img" aria-label="A plain C++ struct and the UI PRISM makes from it: a string becomes a text field, an int and a double number fields, a bool a checkbox, an enum a dropdown.">
