[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-cli"
version = "0.1.0"
description = "Start and maintain a PRISM project: new, update, doctor, size, fault"
requires-python = ">=3.11"
dependencies = ["copier>=9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
prism = "prism_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that render a template and run git"]
